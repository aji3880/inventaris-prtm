apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inventory-app.fullname" . | trunc 63 }}
  labels:
    app.kubernetes.io/name: {{ include "inventory-app.name" . }}
    helm.sh/chart: {{ include "inventory-app.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ include "inventory-app.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "inventory-app.name" . }}
    spec:
      # Do not force runAsUser (OpenShift will assign arbitrary UID)
      securityContext:
        runAsNonRoot: true             # Group untuk akses volume
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "inventory-app.name" . }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          image: "{{ .Values.image.repository }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          env:
            - name: APP_ENV
              value: {{ .Values.env.APP_ENV | quote }}
            - name: APP_DEBUG
              value: {{ .Values.env.APP_DEBUG | quote }}
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-app-key"
                  key: APP_KEY
            - name: DB_CONNECTION
              value: {{ .Values.env.DB_CONNECTION | quote }}
            - name: DB_HOST
              value: {{ .Values.env.DB_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.env.DB_PORT | quote }}
            - name: DB_DATABASE
              value: {{ .Values.env.DB_DATABASE | quote }}
            - name: DB_USERNAME
              value: {{ .Values.env.DB_USERNAME | quote }}
            - name: DB_PASSWORD
              value: {{ .Values.env.DB_PASSWORD | quote }}
            - name: PORT
              value: "{{ .Values.service.targetPort }}"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: cache
              mountPath: /var/www/html/bootstrap/cache
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: '{{ include "inventory-app.fullname" . }}-pvc'
          securityContext:
            fsGroupChangePolicy: "OnRootMismatch"
        - name: cache
          emptyDir: {}
