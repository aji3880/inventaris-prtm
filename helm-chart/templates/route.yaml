{{- if (and .Values.ingress (hasKey .Values.ingress "host") (ne .Values.ingress.host "")) }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "inventory-app.fullname" . }}
spec:
  host: {{ .Values.ingress.host }}
  to:
    kind: Service
    name: {{ include "inventory-app.fullname" . }}
  port:
    targetPort: http
  tls:
    insecureEdgeTerminationPolicy: None
    termination: edge
{{- end }}
